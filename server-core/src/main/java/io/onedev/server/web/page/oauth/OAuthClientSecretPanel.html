<wicket:panel>
	<div class="d-flex align-items-center">
		<span wicket:id="value" class="text-monospace text-break font-size-sm mr-2"></span>
		<a wicket:id="copy" class="flex-shrink-0 mr-1" t:aria-label="Copy client secret"><wicket:svg href="copy" class="icon"></wicket:svg></a>
		<a wicket:id="rotate" class="flex-shrink-0" t:data-tippy-content="Rotate Secret" t:aria-label="Rotate Secret"><wicket:svg href="refresh2" class="icon"></wicket:svg></a>
	</div>
	<div wicket:id="notice" class="text-muted font-size-sm mt-1"><wicket:t>Copy the client secret now. It will not be shown again.</wicket:t></div>
</wicket:panel>
