<wicket:panel>
	<form wicket:id="form" class="bean-edit">
		<div class="modal-header">
			<h5 wicket:id="title" class="modal-title"></h5>
			<button wicket:id="close" type="button" class="close"><wicket:svg href="times" class="icon"/></button>
		</div>
		<div class="modal-body">
			<div wicket:id="description" class="alert alert-light alert-notice editable-description"></div>
			<div wicket:id="feedback"></div>
			<div wicket:id="editor"></div>
			<wicket:enclosure child="warning">
				<div class="text-muted font-size-sm mt-2">
					<wicket:svg href="bulb" class="icon icon-sm mr-1" aria-hidden="true"/> <span wicket:id="warning"></span>
				</div>
			</wicket:enclosure>
		</div>
		<div class="modal-footer">
			<button wicket:id="ok" class="btn btn-primary"><wicket:t>Ok</wicket:t></button>
			<button wicket:id="cancel" class="btn btn-secondary"><wicket:t>Cancel</wicket:t></button>
		</div>
	</form>
</wicket:panel>
