<wicket:extend>	
	<div wicket:id="content"></div>
	<div class="foot text-muted">Powered by <a t:href="nt: ${website}" class="text-muted text-hover-primary"><wicket:t>${productName}</wicket:t></a></div>
	<wicket:fragment wicket:id="passwordCheckFrag">
		<form wicket:id="form" method="post">
			<div wicket:id="feedback"></div>
			<div class="form-group">
				<label wicket:for="userName"><wicket:t>Login name or email address</wicket:t> <span class="text-danger">*</span></label>
				<input wicket:id="userName" autocomplete="username" type="text" class="form-control">
			</div>
			<div class="form-group">
				<label wicket:for="password"><wicket:t>Password</wicket:t> <span class="text-danger">*</span></label>
				<input wicket:id="password" autocomplete="current-password" type="password" class="form-control">
			</div>
			<div class="form-group d-flex flex-wrap justify-content-between">
				<div class="checkbox-inline">
					<label class="checkbox">
						<input wicket:id="rememberMe" id="rememberMe" type="checkbox" class="form-check-input">
						<wicket:t>Remember Me</wicket:t>
					</label>
				</div>
				<a wicket:id="forgetPassword"><wicket:t>Forgot Password?</wicket:t></a>
			</div>
			<button class="btn btn-primary font-weight-bold" type="submit"><wicket:t>Sign in</wicket:t></button>
		</form>
		<wicket:enclosure child="registerUser">
			<div class="signup">
				<span class="text-muted mr-1"><wicket:t>Don't have an account yet?</wicket:t></span> <a wicket:id="registerUser" class="font-weight-bold"><wicket:t>Sign Up!</wicket:t></a>
			</div>
		</wicket:enclosure>
		<wicket:enclosure child="ssoButtons">
		<div class="sso">
			<a wicket:id="ssoButtons" class="btn btn-light btn-block mb-3"><img wicket:id="image" class="mr-3"> <span wicket:id="label"></span></a>
		</div>
		</wicket:enclosure>
	</wicket:fragment>
</wicket:extend>
