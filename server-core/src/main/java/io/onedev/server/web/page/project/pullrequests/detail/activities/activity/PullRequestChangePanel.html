<wicket:panel>
	<div>
		<wicket:svg href="history" class="icon text-gray"></wicket:svg>
		<div class="head">
			<span wicket:id="user"></span>
			<span wicket:id="description"></span>
			<span wicket:id="age"></span>
			<span wicket:id="mergeCommit">
				(<wicket:t>merge commit</wicket:t>: <a wicket:id="hashLink" class="hash font-size-sm"><span wicket:id="hash"></span></a>
				<a wicket:id="copyHash"><wicket:svg href="copy" class="icon icon-sm"></wicket:svg></a>)
			</span>
			<a wicket:id="changes" class="since-changes ml-2" t:data-tippy-content="Changes since this action"><wicket:svg href="diff" class="icon"></wicket:svg></a>
		</div>
		<div wicket:id="body" class="body mt-3"></div>		
	</div>
</wicket:panel>
