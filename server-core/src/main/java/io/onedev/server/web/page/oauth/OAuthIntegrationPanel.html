<wicket:panel>
	<div class="card"><div class="card-body">
		<details>
			<summary class="font-weight-bold"><wicket:t>Integration and supported scopes</wicket:t></summary>
			<p class="mt-4"><wicket:t>Discover endpoints at</wicket:t> <code wicket:id="openidDiscoveryUrl" class="text-break"></code> <wicket:t>or</wicket:t> <code wicket:id="oauthDiscoveryUrl" class="text-break"></code>.</p>

				<tbody><tr wicket:id="scopes"><td><code wicket:id="name"></code></td><td wicket:id="description"></td></tr></tbody>
			</table></div>
		</details>
	</div></div>
</wicket:panel>
