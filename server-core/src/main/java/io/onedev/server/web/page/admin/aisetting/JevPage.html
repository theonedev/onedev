<wicket:extend>
	<div class="card">
		<div class="card-body">
			<div class="alert alert-notice alert-light">
				<wicket:t>
				<a href="https://typesafe.ai/" target="_blank" rel="noopener noreferrer">Jev</a> marks the most likely symbol definition in symbol navigation and suggests field values when creating an issue.
				</wicket:t>
			</div>
			<form wicket:id="form" class="leave-confirm">
				<div wicket:id="editor" class="mb-4"></div>
				<input type="submit" class="btn btn-primary dirty-aware" t:value="Save Settings">
			</form>
		</div>
	</div>
</wicket:extend>
