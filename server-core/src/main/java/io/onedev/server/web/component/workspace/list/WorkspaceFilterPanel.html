<wicket:extend>
    <div class="form-group">
        <label class="control-label"><wicket:t>Status</wicket:t></label>
        <select wicket:id="status" class="form-control"></select>
    </div>
    <div class="form-group">
        <label class="control-label"><wicket:t>Branch</wicket:t></label>
        <select wicket:id="branch" class="form-control"></select>
    </div>
    <wicket:enclosure>
    <div class="form-group">
        <label class="control-label"><wicket:t>Spec</wicket:t></label>
        <select wicket:id="spec" class="form-control"></select>
    </div>
    </wicket:enclosure>
    <div class="form-group">
        <label class="control-label"><wicket:t>Created By</wicket:t></label>
        <select wicket:id="createdBy" class="form-control"></select>
    </div>
    <div class="form-group">
        <label class="control-label"><wicket:t>Ran On Agent</wicket:t></label>
        <select wicket:id="ranAgent" class="form-control"></select>
    </div>
    <div class="form-group">
        <label class="control-label"><wicket:t>Created After</wicket:t></label>
        <div class="clearable-wrapper">
            <input wicket:id="createdAfter" type="text" class="form-control">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label"><wicket:t>Created Before</wicket:t></label>
        <div class="clearable-wrapper">
            <input wicket:id="createdBefore" type="text" class="form-control">
        </div>
    </div>
</wicket:extend>
