<wicket:panel xmlns:wicket="http://www.w3.org/1999/xhtml">
	<div class="access-token border rounded">
		<div class="p-4">
			<div wicket:id="description"></div>
			<div class="access-token-value mb-4">
				<div class="d-flex align-items-center mb-2">
					<span class="font-weight-bold"><wicket:t>Value</wicket:t></span>
					<span wicket:id="expired" class="badge badge-light-danger ml-2"><wicket:t>Expired</wicket:t></span>
				</div>
				<div class="d-flex align-items-center">
					<span wicket:id="value" class="text-monospace text-break font-size-sm mr-2"></span>
					<a wicket:id="copy" class="flex-shrink-0 mr-1" t:aria-label="Copy access token"><wicket:svg href="copy" class="icon"></wicket:svg></a>
					<a wicket:id="rotate" class="flex-shrink-0" t:data-tippy-content="Rotate Access Token" t:aria-label="Rotate Access Token"><wicket:svg href="refresh2" class="icon"></wicket:svg></a>
				</div>
				<div wicket:id="notice" class="access-token-notice text-warning mt-1 font-size-sm" role="alert">
					<wicket:svg href="warning-o" class="icon icon-sm"></wicket:svg>
					<wicket:t>Copy your access token now. It will not be shown again.</wicket:t>
				</div>
			</div>
			<div wicket:id="viewer"></div>
			<div class="d-flex align-items-center mt-4">
				<button wicket:id="edit" type="button" class="btn btn-sm btn-outline-primary"><wicket:t>Edit</wicket:t></button>
				<button wicket:id="delete" type="button" class="btn btn-sm btn-outline-danger ml-auto"><wicket:t>Delete</wicket:t></button>
			</div>
		</div>
	</div>
</wicket:panel>
