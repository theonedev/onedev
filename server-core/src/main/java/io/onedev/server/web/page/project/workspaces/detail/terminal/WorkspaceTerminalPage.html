<wicket:extend>
	<div wicket:id="terminal" class="d-flex flex-column flex-grow-1 p-2 bg-black"></div>
	<wicket:fragment wicket:id="optionsFrag">
		<span class="terminal-scroll-help-desktop px-3" t:data-tippy-content="To scroll in this terminal, press ctrl+b then [. Use the mouse wheel, arrow keys, or page up/down, and press q to exit.">
			<wicket:svg href="question-circle" class="icon"/>
		</span>
		<span class="terminal-scroll-help-mobile px-3" t:data-tippy-content="To scroll in this terminal, tap tmux [, swipe the terminal, and tap tmux [ again to exit.">
			<wicket:svg href="question-circle" class="icon"/>
		</span>
	</wicket:fragment>
</wicket:extend>
