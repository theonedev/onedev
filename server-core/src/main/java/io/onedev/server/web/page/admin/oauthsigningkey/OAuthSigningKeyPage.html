<wicket:extend>
	<div class="card">
		<div class="card-body">
			<div class="alert alert-light alert-notice mb-4">
				<wicket:t>This key signs OpenID Connect ID tokens. OneDev generates it automatically. Applications use the public key to verify ID token signatures.</wicket:t>
			</div>
			<dl>
				<dt><wicket:t>Key ID</wicket:t></dt>
				<dd wicket:id="keyID" class="text-break"></dd>
				<dt class="mb-2"><wicket:t>Public Key</wicket:t> <a wicket:id="copyPublicKey" t:data-tippy-content="Copy public key"><wicket:svg href="copy" class="icon"/></a></dt>
				<dd><pre wicket:id="publicKey" class="font-size-sm bg-light p-3 rounded text-wrap text-break"></pre></dd>
			</dl>
			<a wicket:id="regenerate" class="btn btn-light-primary"><wicket:t>Regenerate</wicket:t></a>
		</div>
	</div>
</wicket:extend>
