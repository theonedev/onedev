<wicket:extend>
	<div wicket:id="content"></div>
	<wicket:fragment wicket:id="requestToResetFrag">
		<form wicket:id="form" method="post">
			<div wicket:id="feedback"></div>
			<div class="form-group">
				<label wicket:for="loginNameOrEmail"><wicket:t>Login name or email address</wicket:t> <span class="text-danger">*</span></label>
				<input wicket:id="loginNameOrEmail" autocomplete="username" type="text" class="form-control">
			</div>
			<div class="simple-actions">
				<button wicket:id="resettingPassword" class="btn btn-primary font-weight-bold" type="submit"><wicket:t>Reset</wicket:t></button>
				<button wicket:id="cancel" class="btn simple-cancel font-weight-bold"><wicket:t>Cancel</wicket:t></button>
			</div>
		</form>
	</wicket:fragment>
	<wicket:fragment wicket:id="resetFrag">
		<form wicket:id="form" method="post">
			<div wicket:id="editor"></div>
			<div class="simple-actions">
				<button class="btn btn-primary font-weight-bold" type="submit"><wicket:t>Ok</wicket:t></button>
				<button wicket:id="cancel" class="btn simple-cancel font-weight-bold"><wicket:t>Cancel</wicket:t></button>
			</div>
		</form>
	</wicket:fragment>
	<wicket:fragment wicket:id="invalidPasswordResetCodeFrag">
		<div class="alert alert-light-danger"><wicket:t>The password reset url is invalid or obsolete</wicket:t></div>
	</wicket:fragment>
</wicket:extend>
