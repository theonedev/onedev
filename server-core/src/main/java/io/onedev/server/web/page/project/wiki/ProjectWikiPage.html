<wicket:extend>
    <div wicket:id="empty" class="bg-white flex-grow-1 d-flex flex-column p-5">
        <div class="alert alert-notice alert-light-warning">
            <wicket:t>Home page not found</wicket:t>
            <a wicket:id="addHome" class="ml-2" t:data-tippy-content="Add home page" t:aria-label="Add home page"><wicket:svg href="plus" class="icon"></wicket:svg></a>
        </div>
    </div>
    <div wicket:id="wiki" class="wiki bg-white flex-grow-1 d-flex flex-column">
        <div class="head d-flex align-items-center justify-content-between flex-wrap px-3 flex-shrink-0 border-bottom">
            <div class="d-flex flex-wrap align-items-center">
                <a wicket:id="revision" class="revision-picker btn btn-light btn-sm mr-3 my-2"></a>
                <div class="my-2 text-break d-flex align-items-baseline">
                    <h3 wicket:id="title" class="mb-0"></h3>
                    <div wicket:id="subtitle" class="text-muted ml-2"><wicket:t>in</wicket:t> <span wicket:id="folder"></span></div>
                </div>
            </div>
            <div wicket:id="actions" class="py-2 d-flex align-items-center ml-3">
                <div class="btn-group">
                <a wicket:id="history" class="btn btn-light btn-hover-primary btn-sm btn-icon" t:data-tippy-content="Page history"><wicket:svg href="clock" class="icon"></wicket:svg></a>
                <a wicket:id="edit" class="btn btn-light btn-hover-primary btn-sm btn-icon" t:data-tippy-content="Edit page"><wicket:svg href="edit" class="icon"></wicket:svg></a>
                <a wicket:id="add" class="btn btn-light btn-hover-primary btn-sm btn-icon" t:data-tippy-content="Add page or upload files"><wicket:svg href="plus" class="icon"></wicket:svg></a>
                <a wicket:id="delete" class="btn btn-light btn-hover-danger btn-sm btn-icon" t:data-tippy-content="Delete page"><wicket:svg href="trash" class="icon"></wicket:svg></a>
                </div>
            </div>
        </div>
        <div class="body autofit flex-grow-1 d-flex flex-column">
            <div wicket:id="homeNotFound" class="p-5">
                <div class="alert alert-notice alert-light-warning">
                    <wicket:t>Home page not found</wicket:t>
                    <a wicket:id="addHome" class="ml-2" t:data-tippy-content="Add home page" t:aria-label="Add home page"><wicket:svg href="plus" class="icon"></wicket:svg></a>
                </div>
            </div>
            <div wicket:id="view" class="wiki-view flex-grow-1 d-flex overflow-hidden">
                <main class="wiki-content flex-grow-1 overflow-auto p-4">
                    <wicket:enclosure>
                    <div class="alert alert-notice alert-light-warning">
                        <wicket:t>Home page not found</wicket:t>
                        <a wicket:id="addHome" class="ml-2" t:data-tippy-content="Add home page" t:aria-label="Add home page"><wicket:svg href="plus" class="icon"></wicket:svg></a>
                    </div>
                    </wicket:enclosure>
                    <div wicket:id="body"></div>
                </main>
                <aside wicket:id="navigation" class="wiki-navigation markdown-outline side need-width">
                    <div class="ui-resizable-handle ui-resizable-w flex-shrink-0"></div>
                    <div class="navigation-content flex-grow-1 overflow-auto p-3">
                        <details class="wiki-pages border-bottom pb-3 mb-3">
                            <summary class="font-weight-bolder"><span class="ml-2"><wicket:t>Pages</wicket:t></span></summary>
                            <ul class="list-unstyled mt-2 mb-0">
                                <li wicket:id="pages" class="mb-2">
                                    <div class="d-flex align-items-center">
                                        <a wicket:id="expand" class="page-expand mr-1" t:aria-label="Toggle page outline"><span class="page-expand-indicator" aria-hidden="true"></span></a>
                                        <a wicket:id="page" class="text-break"><span wicket:id="name"></span></a>
                                    </div>
                                    <div wicket:id="outline" class="wiki-page-outline"></div>
                                </li>
                            </ul>
                        </details>
                        <div wicket:id="sidebar" class="mb-4"></div>
                        <div wicket:id="currentOutline" class="wiki-page-outline mb-4"></div>
                        <div class="d-flex flex-wrap align-items-center">
                            <a wicket:id="sidebarEdit" class="btn btn-outline-secondary btn-sm mr-2 mb-2"><span wicket:id="label"></span></a>
                            <a wicket:id="useDefault" class="btn btn-outline-secondary btn-sm mb-2"><wicket:t>Use default</wicket:t></a>
                        </div>
                    </div>
                </aside>
            </div>
            <form wicket:id="form" class="leave-confirm overflow-auto p-4">
                <div wicket:id="feedback"></div>
                <div wicket:id="editor"></div>
                <input wicket:id="save" type="submit" class="btn btn-primary" t:value="Save page">
                <a wicket:id="cancel" class="btn btn-light ml-2"><wicket:t>Cancel</wicket:t></a>
            </form>
        </div>
    </div>
    <wicket:fragment wicket:id="deleteConfirm">
        <div class="modal-header"><h5 wicket:id="title" class="modal-title"></h5></div>
        <form wicket:id="form">
            <div class="modal-body">
                <div wicket:id="feedback"></div>
                <label><wicket:t>Commit message</wicket:t></label>
                <textarea wicket:id="message" class="form-control" rows="3"></textarea>
            </div>
            <div class="modal-footer">
                <button wicket:id="confirm" type="submit" class="btn btn-danger"><span wicket:id="label"></span></button>
                <a wicket:id="cancel" class="btn btn-light"><wicket:t>Cancel</wicket:t></a>
            </div>
        </form>
    </wicket:fragment>
</wicket:extend>
