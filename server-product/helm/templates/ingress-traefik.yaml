{{- $controller := include "ods.ingressController" . -}}
{{- if and .Values.ingress.enabled (eq $controller "traefik") -}}
{{- $traefik := .Values.ingress.traefik }}
{{- $middleware := $traefik.middleware | default dict }}
{{- $ssh := .Values.ssh | default dict }}
{{- $separateService := $ssh.separateService | default dict }}
{{- $hosts := concat (list .Values.ingress.host) (.Values.ingress.additionalHosts | default (list)) }}
{{- if $ssh.enabled }}
apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: {{ include "ods.fullname" . }}-ssh
  namespace: {{ .Release.Namespace }}
  labels:
{{ include "ods.labels" . | indent 4 }}
spec:
  entryPoints:
    - gitssh
  routes:
    - match: HostSNI(`*`)
      services:
        {{- if $separateService.enabled }}
        - name: {{ include "ods.fullname" . }}-ssh
          port: {{ default "22" $ssh.port }}
        {{- else }}
        - name: {{ include "ods.fullname" . }}
          port: {{ default "22" $ssh.port }}
        {{- end }}
---
{{- end }}
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: {{ include "ods.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
{{ include "ods.labels" . | indent 4 }}
spec:
  entryPoints:
    - {{ ternary "websecure" "web" .Values.ingress.tls.enabled }}
  routes:
  {{- $matchers := list }}
  {{- range $hosts }}
    {{- $matchers = append $matchers (printf "Host(`%s`)" .) }}
  {{- end }}
  - match: {{ join " || " $matchers }}
    kind: Rule
    middlewares:
      - name: {{ include "ods.traefikMiddlewareName" . }}
        namespace: {{ .Release.Namespace }}
      {{- range $traefik.extraMiddlewares }}
      - name: {{ .name }}
        namespace: {{ default $.Release.Namespace .namespace }}
      {{- end }}
    services:
    - name: {{ include "ods.fullname" . }}
      port: {{ default "80" .Values.service.ports.http }}
      sticky:
        cookie:
          httpOnly: true
{{- if .Values.ingress.tls.enabled }}
  tls:
    secretName: {{ .Values.ingress.tls.secretName }}
{{- end }}
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ include "ods.traefikMiddlewareName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
{{ include "ods.labels" . | indent 4 }}
spec:
  buffering:
    maxRequestBodyBytes: {{ int64 (default 1073741824 $middleware.maxRequestBodyBytes) }}
    memRequestBodyBytes: {{ int64 (default 1073741824 $middleware.memRequestBodyBytes) }}
{{- end }}
