{{- $traefikEnabled := eq (include "ods.traefikEnabled" .) "true" -}}
{{- if .Values.ingress.enabled -}}
{{- if not $traefikEnabled }}
{{- $annotations := dict }}
{{- if and .Values.ingress.tls.enabled .Values.ingress.tls.acme.enabled }}
  {{- $_ := set $annotations "cert-manager.io/issuer" (include "ods.fullname" .) }}
{{- end }}
{{- with (.Values.ingress.nginx | default dict).annotations }}
  {{- $annotations = mergeOverwrite $annotations . }}
{{- end }}
{{- with .Values.ingress.annotations }}
  {{- $annotations = mergeOverwrite $annotations . }}
{{- end }}
{{- if and .Values.ingress.className (not (semverCompare ">=1.18-0" .Capabilities.KubeVersion.GitVersion)) }}
  {{- if not (hasKey $annotations "kubernetes.io/ingress.class") }}
    {{- $_ := set $annotations "kubernetes.io/ingress.class" .Values.ingress.className }}
  {{- end }}
{{- end }}
{{- if semverCompare ">=1.19-0" .Capabilities.KubeVersion.GitVersion -}}
apiVersion: networking.k8s.io/v1
{{- else if semverCompare ">=1.14-0" .Capabilities.KubeVersion.GitVersion -}}
apiVersion: networking.k8s.io/v1beta1
{{- else -}}
apiVersion: extensions/v1beta1
{{- end }}
kind: Ingress
metadata:
  name: {{ include "ods.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
{{ include "ods.labels" . | indent 4 }}
  {{- with $annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if and .Values.ingress.className (semverCompare ">=1.18-0" .Capabilities.KubeVersion.GitVersion) }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
  - hosts:
      - {{ .Values.ingress.host }}
    secretName: {{ .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: "/"
            {{- if semverCompare ">=1.18-0" $.Capabilities.KubeVersion.GitVersion }}
            pathType: ImplementationSpecific
            {{- end }}
            backend:
              {{- if semverCompare ">=1.19-0" $.Capabilities.KubeVersion.GitVersion }}
              service:
                name: {{ include "ods.fullname" $ }}
                port:
                  name: "http"
              {{- else }}
              serviceName: {{ include "ods.fullname" $ }}
              servicePort: {{ default "80" .Values.service.ports.http }}
              {{- end }}
{{- end }}
{{- if $traefikEnabled }}
{{- $traefik := .Values.ingress.traefik }}
{{- $middleware := $traefik.middleware | default dict }}
{{- $sshEntryPoint := include "ods.traefikSshEntryPoint" . }}
{{- if $sshEntryPoint }}
apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: {{ include "ods.fullname" . }}-ssh
  namespace: {{ .Release.Namespace }}
  labels:
{{ include "ods.labels" . | indent 4 }}
spec:
  entryPoints:
    - {{ $sshEntryPoint }}
  routes:
    - match: HostSNI(`*`)
      services:
        {{- if .Values.service.separateSSH.enabled }}
        - name: {{ include "ods.fullname" . }}-ssh
          port: {{ default "22" .Values.service.separateSSH.port }}
        {{- else }}
        - name: {{ include "ods.fullname" . }}
          port: {{ default "22" .Values.service.ports.ssh }}
        {{- end }}
---
{{- end }}
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: {{ include "ods.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
{{ include "ods.labels" . | indent 4 }}
spec:
  entryPoints:
    - {{ default "websecure" $traefik.entryPoint }}
  routes:
  {{- $matchers := list }}
  {{- range $traefik.hosts | default (list .Values.ingress.host) }}
    {{- $matchers = append $matchers (printf "`%s`" .) }}
  {{- end }}
  - match: Host({{ join ", " $matchers }})
    kind: Rule
    middlewares:
      - name: {{ include "ods.traefikMiddlewareName" . }}
        namespace: {{ .Release.Namespace }}
      {{- range $traefik.extraMiddlewares }}
      - name: {{ .name }}
        namespace: {{ default $.Release.Namespace .namespace }}
      {{- end }}
    services:
    - name: {{ include "ods.fullname" . }}
      port: {{ default "80" .Values.service.ports.http }}
      sticky:
        cookie:
          httpOnly: true
{{- if .Values.ingress.tls.enabled }}
  tls:
    secretName: {{ .Values.ingress.tls.secretName }}
{{- end }}
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ include "ods.traefikMiddlewareName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
{{ include "ods.labels" . | indent 4 }}
spec:
  buffering:
    maxRequestBodyBytes: {{ int64 (default 1073741824 $middleware.maxRequestBodyBytes) }}
    memRequestBodyBytes: {{ int64 (default 1073741824 $middleware.memRequestBodyBytes) }}
{{- end }}
{{- end }}
